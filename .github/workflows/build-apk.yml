
name: Build TIKORA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodları indir
        uses: actions/checkout@v4

      - name: Node ve Java kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: ZIP paketini aç
        run: |
          unzip -o www/TIKORA-KONTROL-DUZELTME.zip -d /tmp/tikora
          cp -r /tmp/tikora/tikora_build/www/. www/
          cp /tmp/tikora/tikora_build/package.json .
          cp /tmp/tikora/tikora_build/capacitor.config.json .

      - name: Bağımlılıkları kur
        run: npm install

      - name: Android projesini hazırla
        run: |
          npx cap add android
          npx cap sync android

      - name: APK oluştur
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: APK dosyasını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: TIKORA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
