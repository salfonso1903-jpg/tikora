name: Build TIKORA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find application folder
        run: |
          FILE=$(find . -name package.json -not -path '*/node_modules/*' | head -n 1)
          test -n "$FILE"
          APP_DIR=$(dirname "$FILE")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Install and build APK
        run: |
          cd "$APP_DIR"
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tikora.app",
            "appName": "TIKORA",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIKORA-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
