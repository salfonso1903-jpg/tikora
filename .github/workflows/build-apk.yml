1|// Design tokens for this app. Light theme only.Always modify the colors and theme to Dark, Light or Dark and Light according to the design guidelines.
2|//
3|// The keys match the "color" block of /app/design_guidelines.json. Fill the
4|// values from that file (or from the user's brand colors). Keep every key; do
5|// not add a second theme or colors file; do not write color literals in
6|// components.
7|//
8|// How the names work: a plain key is a background, and its `on` partner is the
9|// text or icon color that sits on top of it. Always use them as a pair.
10|//   <View style={{ backgroundColor: colors.brandPrimary }}>
11|//     <Text style={{ color: colors.onBrandPrimary }}>Continue</Text>
12|//   </View>
13|//
14|// Styling a screen or component: build the sheet with makeStyles so colors
15|// and layout live together and follow the active scheme:
16|//   const useStyles = makeStyles((colors) => ({
17|//     card: { backgroundColor: colors.surfaceSecondary, padding: 16 },
18|//     title: { color: colors.onSurfaceSecondary, fontSize: 16 },
19|//   }));
20|//   function Screen() {
21|//     const styles = useStyles();
22|//     return <View style={styles.card}><Text style={styles.title}>Hi</Text></View>;
23|//   }
24|// For color props that are not styles (icon color, placeholderTextColor,
25|// ActivityIndicator) read useTheme().colors inside the component.
26|// Never call StyleSheet.create with color values at module level; it cannot
27|// follow the scheme.
28|//
29|// To support dark mode later: add `dark` to `themes` with every key filled.
30|// Nothing else changes; the device setting takes over automatically.
31|// Feel free to add as many new colors as you need to support the design guidelines.
32|
33|import { useMemo } from "react";
34|import { Appearance, StyleSheet, useColorScheme } from "react-native";
35|
36|export type ColorScheme = "light" | "dark";
37|
38|const light = {
39|  // ---------------------------------------------------------------------------
40|  // Surfaces: backgrounds, from the screen down to small fills.
41|  // Each `on` key is the text and icon color for that background.
42|  // ---------------------------------------------------------------------------
43|  surface: "#FFFFFF", // primary canvas, most of every screen
44|  onSurface: "#111827", // text and icons on the canvas
45|  surfaceSecondary: "#F9FAFB", // cards, sheets, list rows
46|  onSurfaceSecondary: "#374151", // text and icons on cards, sheets, rows
47|  surfaceTertiary: "#F3F4F6", // input backgrounds, chips, deepest nesting
48|  onSurfaceTertiary: "#4B5563", // text on inputs and chips; also muted text
49|  surfaceInverse: "#1F2937", // tooltips, snackbars, anything popping against the theme
50|  onSurfaceInverse: "#FFFFFF", // text and icons on the inverse surface
51|  muted: "#6B7280", // subdued text on surface: captions, timestamps, placeholders
52|
53|  // ---------------------------------------------------------------------------
54|  // Brand: the identity color and the fills built from it.
55|  // Neutral by default; replace with the design guidelines values.
56|  // ---------------------------------------------------------------------------
57|  brand: "#111827", // base hue, anchor only; Primary, Secondary, Tertiary are weights of it
58|  onBrand: "#FFFFFF", // text and icons placed directly on brand
59|  brandPrimary: "#111827", // primary CTA, active tab indicator, selected states
60|  onBrandPrimary: "#FFFFFF", // text and icons on brandPrimary
61|  brandSecondary: "#E5E7EB", // secondary CTA, less prominent accents
62|  onBrandSecondary: "#111827", // text and icons on brandSecondary
63|  brandTertiary: "#F3F4F6", // chips, tags, badges, subtle brand moments
64|  onBrandTertiary: "#111827", // text and icons on brandTertiary
65|
66|  // ---------------------------------------------------------------------------
67|  // Status: semantic only, never decorative. Fill for badges, banners and
68|  // toasts; the `on` key is text on that fill. The plain key is also safe as
69|  // text on `surface`.
70|  // ---------------------------------------------------------------------------
71|  success: "#15803D",
72|  onSuccess: "#FFFFFF",
73|  warning: "#B45309",
74|  onWarning: "#FFFFFF",
75|  error: "#B91C1C",
76|  onError: "#FFFFFF",
77|  info: "#1D4ED8",
78|  onInfo: "#FFFFFF",
79|
80|  // ---------------------------------------------------------------------------
81|  // Lines
82|  // ---------------------------------------------------------------------------
83|  border: "#E5E7EB", // hairline outline, 0.5pt or 1pt max: inputs, cards
84|  borderStrong: "#D1D5DB", // focus rings, selected outlines, 1.5pt max
85|  divider: "#E5E7EB", // subtle list separators
86|};
87|
88|export type ThemeColors = typeof light;
89|
90|export const defaultScheme = "light" satisfies ColorScheme;
91|
92|export const themes: { light: ThemeColors; dark?: ThemeColors } = { light };
93|
94|// In-app theme toggle, only after `dark` exists in `themes`. Call
95|// setColorScheme("dark"), setColorScheme("light"), or setColorScheme(null) to
96|// follow the device. Every useTheme() consumer re-renders. Persisting the
97|// choice and re-applying it on launch is the toggle's job.
98|export function setColorScheme(scheme: ColorScheme | null) {
99|  // RN 0.86 re-reads the device scheme only for the literal "unspecified";
100|  // null would pin useColorScheme() to null and the app to light.
101|  Appearance.setColorScheme?.(scheme ?? "unspecified");
102|}
103|
104|// Keep native surfaces (alerts, pickers, navigation chrome) on the schemes this
105|// app ships: light only forces light; once `dark` exists the device decides.
106|// Optional call because react-native-web does not implement it.
107|setColorScheme?.(themes.dark ? null : defaultScheme);
108|
109|export function useTheme(): { scheme: ColorScheme; colors: ThemeColors } {
110|  const system = useColorScheme();
111|  const scheme: ColorScheme = (system === "light" || system === "dark") && themes[system] ? system : defaultScheme;
112|  return { scheme, colors: themes[scheme] ?? themes.light };
113|}
114|
115|// Themed StyleSheet: returns a hook that builds the sheet from the active
116|// scheme's colors and memoizes it until the scheme changes.
117|export function makeStyles<T extends StyleSheet.NamedStyles<T> | StyleSheet.NamedStyles<any>>(
118|  factory: (colors: ThemeColors) => T & StyleSheet.NamedStyles<any>,
119|): () => T {
120|  return function useStyles(): T {
121|    const { colors } = useTheme();
122|    return useMemo(() => StyleSheet.create(factory(colors)), [colors]);
123|  };
124|}
