name: TIKORA APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source archive
        run: |
          curl -L "https://github.com/salfonso1903-jpg/tikora/raw/main/TIKORA-tum-ozellikler-kaynak.zip" -o source.zip
          unzip source.zip -d project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: project/TIKORA
        run: npm install

      - name: Build web app
        working-directory: project/TIKORA
        run: npm run build

      - name: Build APK
        working-directory: project/TIKORA
        run: npx cap sync android && cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIKORA-APK
          path: project/TIKORA/android/app/build/outputs/apk/debug/app-debug.apk
