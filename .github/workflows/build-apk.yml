name: Build TIKORA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kaynak paketi aç
        run: |
          unzip -o TIKORA-TEK-PAKET.zip -d .
          test -f package.json
          test -f www/index.html
          test -f www/app.js
          node --check www/app.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Android oluştur
        run: npx cap add android

      - name: Android eşitle
        run: npx cap sync android

      - name: APK oluştur
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: TIKORA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
