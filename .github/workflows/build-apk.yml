name: TIKORA APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        run: |
          curl -L "https://github.com/salfonso1903-jpg/tikora/raw/main/TIKORA-tum-ozellikler-kaynak.zip" -o source.zip
          unzip -q source.zip -d project

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: project/TIKORA
        run: npm install

      - name: Create Android project
        working-directory: project/TIKORA
        run: npx cap add android

      - name: Sync Android
        working-directory: project/TIKORA
        run: npx cap sync android

      - name: Build APK
        working-directory: project/TIKORA/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TIKORA-APK
          path: project/TIKORA/android/app/build/outputs/apk/debug/app-debug.apk
