
name: Build TIKORA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build TIKORA
        run: |
          APP_DIR="."
          rm -rf "$APP_DIR/capacitor.config.json"
          cat > "$APP_DIR/capacitor.config.json" <<'EOF'
          {
            "appId": "com.tikora.app",
            "appName": "TIKORA",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          cd "$APP_DIR"
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIKORA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
