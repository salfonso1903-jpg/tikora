1|import asyncio
2|from contextlib import suppress
3|from fastapi import FastAPI, APIRouter, Query
4|from dotenv import load_dotenv
5|from starlette.middleware.cors import CORSMiddleware
6|from motor.motor_asyncio import AsyncIOMotorClient
7|from pymongo import ASCENDING, DESCENDING, IndexModel
8|import os
9|import logging
10|from pathlib import Path
11|from pydantic import BaseModel, Field
12|from typing import List
13|import uuid
14|from datetime import datetime, timezone
15|
16|
17|ROOT_DIR = Path(__file__).parent
18|load_dotenv(ROOT_DIR / '.env')
19|
20|# MongoDB connection
21|mongo_url = os.environ['MONGO_URL']
22|client = AsyncIOMotorClient(mongo_url)
23|db = client[os.environ['DB_NAME']]
24|
25|# One entry per collection: every field a route filters, sorts or dedupes on. Add the index in the same edit as the query.
26|INDEXES: dict[str, list[IndexModel]] = {
27|    "status_checks": [
28|        IndexModel([("id", ASCENDING)], name="id", unique=True),
29|        IndexModel([("timestamp", DESCENDING)], name="timestamp_desc"),
30|    ],
31|}
32|
33|
34|async def ensure_indexes() -> None:
35|    for collection, models in INDEXES.items():
36|        for model in models:  # one at a time so a bad spec skips only itself
37|            try:
38|                await db[collection].create_indexes([model])
39|            except Exception as exc:  # never block boot on an index; the log line names what to fix
40|                logging.getLogger(__name__).error("ensure_indexes(%s.%s): %s", collection, model.document["name"], exc)
41|
42|# Create the main app without a prefix
43|app = FastAPI()
44|
45|# Probe endpoint for the deployer and pod health checks: root-level (not /api), no DB call.
46|@app.get("/health", include_in_schema=False)
47|@app.head("/health", include_in_schema=False)
48|async def health():
49|    return {"status": "ok"}
50|
51|# Create a router with the /api prefix
52|api_router = APIRouter(prefix="/api")
53|
54|
55|# Define Models
56|class StatusCheck(BaseModel):
57|    id: str = Field(default_factory=lambda: str(uuid.uuid4()))
58|    client_name: str
59|    timestamp: datetime = Field(default_factory=lambda: datetime.now(timezone.utc))
60|
61|class StatusCheckCreate(BaseModel):
62|    client_name: str
63|
64|# Add your routes to the router instead of directly to app
65|@api_router.get("/")
66|async def root():
67|    return {"message": "Hello World"}
68|
69|@api_router.post("/status", response_model=StatusCheck)
70|async def create_status_check(input: StatusCheckCreate):
71|    status_dict = input.dict()
72|    status_obj = StatusCheck(**status_dict)
73|    _ = await db.status_checks.insert_one(status_obj.dict())
74|    return status_obj
75|
76|@api_router.get("/status", response_model=List[StatusCheck])
77|async def get_status_checks(limit: int = Query(20, ge=1, le=100)):
78|    status_checks = await db.status_checks.find({}, {"_id": 0}).sort("timestamp", -1).limit(limit).to_list(limit)
79|    return [StatusCheck(**status_check) for status_check in status_checks]
80|
81|# Include the router in the main app
82|app.include_router(api_router)
83|
84|app.add_middleware(
85|    CORSMiddleware,
86|    allow_credentials=True,
87|    allow_origins=["*"],
88|    allow_methods=["*"],
89|    allow_headers=["*"],
90|)
91|
92|# Configure logging
93|logging.basicConfig(
94|    level=logging.INFO,
95|    format='%(asctime)s - %(name)s - %(levelname)s - %(message)s'
96|)
97|logger = logging.getLogger(__name__)
98|
99|@app.on_event("startup")
100|async def start_index_build():
101|    app.state.index_task = asyncio.create_task(ensure_indexes())  # background: a big index build must not block boot
102|
103|@app.on_event("shutdown")
104|async def shutdown_db_client():
105|    app.state.index_task.cancel()  # stop a build still running before its client closes
106|    with suppress(asyncio.CancelledError):
107|        await app.state.index_task
108|    client.close()
