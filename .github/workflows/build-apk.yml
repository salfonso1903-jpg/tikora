
name: Build TIKORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub kaynaklarini indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Yeni TIKORA paketini ac
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/tikora
          unzip -o www/TIKORA-BIRLESTIRILMIS-KAYNAK.zip -d /tmp/tikora

          APP_DIR=$(dirname "$(find /tmp/tikora -type f -name index.html -print -quit)")
          if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/app.js" ] || [ ! -f "$APP_DIR/style.css" ] || [ ! -f "$APP_DIR/config.js" ]; then
            echo "HATA: Uygulama dosyalari ZIP icinde bulunamadi."
            exit 1
          fi

          mkdir -p www
          cp -f "$APP_DIR"/* www/

          PACKAGE_FILE=$(find /tmp/tikora -type f -name package.json -print -quit)
          CONFIG_FILE=$(find /tmp/tikora -type f -name capacitor.config.json -print -quit)

          if [ -z "$PACKAGE_FILE" ] || [ -z "$CONFIG_FILE" ]; then
            echo "HATA: package.json veya capacitor.config.json bulunamadi."
            exit 1
          fi

          cp "$PACKAGE_FILE" package.json
          cp "$CONFIG_FILE" capacitor.config.json

          echo "Kaynak dosyalari kontrol edildi."

      - name: Bagimliliklari kur
        run: npm install

      - name: Android projesini olustur
        run: |
          npx cap add android
          npx cap sync android

      - name: APK olustur
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: TIKORA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
