<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b14">
<title>TIKORA</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
<button id="addBtn" aria-label="Gönderi ekle">＋</button>
<b>TIKORA</b>
<button id="notificationsBtn" aria-label="Bildirimler">♢ <span id="notificationCount"></span></button>
</header>

<section id="auth" class="auth card" hidden>
<h1>TIKORA'ya hoş geldin</h1>
<p>Topluluğa katıl, anlarını paylaş.</p>
<div class="authModeSwitch">
<button id="showLogin" type="button" class="authModeActive">Giriş yap</button>
<button id="showRegister" type="button" class="secondary">Hesap oluştur</button>
</div>
<label class="authLabel" for="email">E-posta adresi</label>
<input id="email" type="email" placeholder="ornek@mail.com" autocomplete="email">
<label class="authLabel" for="password">Şifre</label>
<input id="password" type="password" placeholder="En az 6 karakter" autocomplete="current-password">
<div id="usernameField" hidden>
<label class="authLabel" for="username">Kullanıcı adı</label>
<input id="username" placeholder="Kullanıcı adını seç" autocomplete="username">
</div>
<div id="emailOtpPanel" class="authEmailOtp" hidden>
<label class="authLabel" for="emailOtp">E-posta doğrulama kodu</label>
<input id="emailOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6 haneli kod">
<button id="verifyEmailOtp" type="button">Kodu doğrula ve kayıt ol</button>
</div>
<div class="actions authActions">
<button id="signIn" type="button">Giriş yap</button>
<button id="resetPassword" type="button" class="secondary">Şifremi unuttum</button>
<button id="signUp" type="button" hidden>Doğrulama kodu gönder</button>
</div>
<small id="authMsg">Giriş için e-posta ve şifreni yaz. Yeni misin? Hesap oluştur sekmesine geç.</small>
</section>

<main id="app" hidden>
<div class="stories">
<div class="story addStory" id="storyAdd">
<div>＋</div>
<span>Hikâyen</span>
</div>
<div id="storyList" class="storyRow"></div>
</div>

<section id="home" class="screen">
<div class="feedHead">
<b>Senin için</b>
<span>Takip akışı</span>
</div>
<div id="feed"></div>
</section>

<section id="reels" class="screen" hidden>
<div id="videoFeed"></div>
</section>

<section id="explore" class="screen" hidden>
<h2>Keşfet</h2>
<input id="search" placeholder="Kullanıcı ara">
<div id="searchResults"></div>
</section>

<section id="messages" class="screen" hidden>
<h2>Mesajlar</h2>
<div id="inboxList"></div>
<div id="chatArea"></div>
</section>

<section id="notifications" class="screen" hidden>
<h2>Bildirimler</h2>
<div id="notificationList"></div>
</section>

<section id="profile" class="screen" hidden>
<div id="myProfile"></div>
<div id="accountTools" class="card">
<h3>Hesap ve güvenlik</h3>
<button id="savedBtn">Kaydedilenler</button>
<button id="friendRequestsBtn">Arkadaşlık istekleri</button>
<button id="settingsBtn">Ayarlar</button>
<button id="blockedBtn">Engellediklerim</button>
</div>
</section>

<section id="settings" class="screen" hidden>
<h2>Ayarlar</h2>
<label><input id="privateAccount" type="checkbox"> Gizli hesap</label>
<label><input id="allowMessages" type="checkbox" checked> Mesaj alabil</label>
<label><input id="notificationsEnabled" type="checkbox" checked> Bildirimler</label>
<button id="saveSettings">Ayarları kaydet</button>
<button id="settingsBack" class="secondary">Geri</button>
<div id="settingsStatus"></div>
</section>
</main>

<nav id="nav" hidden>
<button data-screen="home">⌂<small>Ana sayfa</small></button>
<button data-screen="reels">▶<small>Videolar</small></button>
<button data-screen="explore">⌕<small>Keşfet</small></button>
<button data-screen="messages">✉<small>Mesajlar</small></button>
<button data-screen="profile">●<small>Profil</small></button>
</nav>

<dialog id="postDialog">
<form method="dialog" id="postForm">
<h2>Yeni gönderi</h2>
<textarea id="caption" placeholder="Aklından neler geçiyor?"></textarea>
<input id="media" type="file" accept="image/*,video/*">
<div class="actions">
<button value="cancel" class="secondary">Vazgeç</button>
<button id="publish" type="button">Paylaş</button>
</div>
<small id="postMsg"></small>
</form>
</dialog>

<div id="toast" role="status"></div>

<script type="module" src="app.js"></script>

</body>
</html>
